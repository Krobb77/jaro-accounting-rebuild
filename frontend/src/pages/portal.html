---
title: Client portal — Jaro Accounting
description: Your [[portal_name]] client portal dashboard.
path: /portal/
nav: none
sitemap: false
scripts: portal.js
---
<main id="main" tabindex="-1" class="site-main portal-page" data-portal-chrome="authed">
  <div class="container">
    <!-- Session warning banner (≤120s). -->
    <div id="session-banner" class="session-banner" role="alert" hidden>
      <p>Your session expires in <strong data-countdown>2:00</strong> due to inactivity.</p>
      <button type="button" id="session-extend" class="btn btn--small">Stay signed in</button>
    </div>

    <nav class="portal-nav" aria-label="Portal">
      <a href="/portal/" aria-current="page">Dashboard</a>
      <a href="/portal/documents/">Documents</a>
      <a href="/portal/filings/">Filings</a>
      <a href="/portal/invoices/">Invoices</a>
      <button type="button" id="portal-logout" class="link-button">Sign out</button>
    </nav>

    <div id="portal-error" class="error-summary" role="alert" hidden></div>
    <div id="portal-root" role="status"><p>Loading your dashboard&hellip;</p></div>
  </div>

  <!-- Terms modal: no dismiss — Accept or Sign out. -->
  <div id="terms-modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="terms-title" hidden>
    <div class="modal__box">
      <h2 id="terms-title">Engagement terms</h2>
      <div id="terms-body" class="terms-body"></div>
      <div id="terms-error" class="error-summary" role="alert" hidden></div>
      <div class="modal__actions">
        <button type="button" id="terms-accept" class="btn">Accept</button>
        <button type="button" id="terms-signout" class="link-button">Sign out</button>
      </div>
    </div>
  </div>

</main>

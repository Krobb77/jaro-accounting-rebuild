# Jaro Accounting — production nginx configuration.
#
# Serves the static frontend dist/ directly and proxies /api/* to uvicorn.
# deploy: copy to /etc/nginx/sites-available/jaroaccounting, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`.
# Variables used below (fill in at deploy; NOT real values):
#   $APP_ROOT  — checkout root, e.g. /srv/jaroaccounting (dist/ at $APP_ROOT/frontend/dist)
#   $TLS_CERT  — fullchain path from the ACME client
#   $TLS_KEY   — private key path from the ACME client

upstream jaro_api {
    server 127.0.0.1:8000 fail_timeout=5s;
}

# --- www -> apex (canonical host) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.jaroaccounting.com;
    return 301 https://jaroaccounting.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jaroaccounting.com;
    ssl_certificate $TLS_CERT;
    ssl_certificate_key $TLS_KEY;
    return 301 https://jaroaccounting.com$request_uri;
}

# --- apex ---
server {
    listen 80;
    listen [::]:80;
    server_name jaroaccounting.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jaroaccounting.com;

    ssl_certificate $TLS_CERT;
    ssl_certificate_key $TLS_KEY;
    # Modern TLS: TLSv1.2+ only; HSTS below assumes the cert is valid.
    ssl_protocols TLSv1.2 TLSv1.3;

    root $APP_ROOT/frontend/dist;
    index index.html;

    # Legacy AMP/mobile query variant -> strip and canonicalize.
    if ($arg_noamp = "mobile") {
        return 301 https://$host$uri;
    }

    # WordPress legacy paths -> home (the old site was WordPress).
    location ~ ^/wp-(admin|content|includes|login|json|cron|comments-post|signup) {
        return 301 https://$host/;
    }
    location = /xmlrpc.php { return 301 https://$host/; }

    # /blog/ -> / (the WordPress placeholder post was deleted in the rebuild).
    location = /blog/ { return 301 https://$host/; }
    location = /blog { return 301 https://$host/; }

    # /thank-you-for-your-booking/ is now a DYNAMIC confirmation render
    # (booking widget writes it from the stored record). Direct visits have
    # no booking context to render -> send them to the consultation page.
    location = /thank-you-for-your-booking/ {
        return 301 https://$host/free-30-min-consultation/;
    }
    location = /thank-you-for-your-booking {
        return 301 https://$host/free-30-min-consultation/;
    }

    # Non-trailing-slash canonical URLs -> trailing slash (301). The API,
    # assets, and files with extensions are excluded.
    location ~ ^/(about-us|our-services|contact-us|free-30-min-consultation|privacy|terms|legal|engagement-terms|faq|portal/login|portal/accept|portal/reset-password|portal/documents|portal/filings|portal/invoices|portal/admin)$ {
        return 301 https://$host$1/;
    }

    # Portal deep links -> flat dist files (frontend/DECISIONS: pretty URLs
    # map to flat files; the frontend never computes session expiry).
    location = /portal/             { try_files /portal.html =404; }
    location = /portal              { return 301 https://$host/portal/; }
    location = /portal/login/       { try_files /portal-login.html =404; }
    location = /portal/accept/      { try_files /portal-accept.html =404; }
    location = /portal/reset-password/ { try_files /portal-reset-password.html =404; }
    location = /portal/documents/   { try_files /portal-documents.html =404; }
    location = /portal/filings/     { try_files /portal-filings.html =404; }
    location = /portal/invoices/    { try_files /portal-invoices.html =404; }
    location = /portal/admin/       { try_files /portal-admin.html =404; }
    location ~ ^/portal/ { return 404; }  # unknown portal path, not a catch-all

    # Tokenized booking manage links -> the manage page (token is read from
    # the URL path by JS; the backend never distinguishes token states).
    location ~ ^/booking/manage/ {
        try_files /booking-manage.html =404;
    }

    # API -> uvicorn (the /api prefix is preserved).
    location /api/ {
        proxy_pass http://jaro_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # The app's own A5 budgets + fail-closed 503s do the throttling;
        # nginx only bounds slow clients.
        client_max_body_size 26m;  # matches the 25 MB portal upload cap + headroom
    }

    # Static pages: trailing-slash URLs -> flat files.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Assets: long cache; the build fingerprints nothing, so keep it modest.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }
    location /css/ {
        expires 7d;
        add_header Cache-Control "public" always;
    }
    location /js/ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Security headers (the app sets its own cookie flags; these are the
    # transport layer's).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Custom 404 page from the built dist.
    error_page 404 /404.html;

    access_log /var/log/nginx/jaroaccounting-access.log;
    error_log /var/log/nginx/jaroaccounting-error.log warn;
}
